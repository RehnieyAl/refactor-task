<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taller de arquitectura — Gestor de tareas</title>
  <link rel="stylesheet" href="../src/styles/styles.css">
  <script type="module" src="../src/app.js"></script>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <p class="eyebrow">SENA · ADSO</p>
      <h1>Gestor de tareas</h1>
      <p class="muted">Proyecto base para practicar separación de responsabilidades.</p>
      <span id="api-status" class="status is-info" role="status">Conectando con API…</span>
    </header>

    <main>
      <section class="panel" aria-labelledby="task-form-title">
        <h2 id="task-form-title">Nueva tarea</h2>
        <form id="task-form" class="task-form" novalidate>
          <label for="title">Título</label>
          <input id="title" name="title" required autocomplete="off" placeholder="Ej. Crear diagrama de arquitectura">
          <label for="description">Descripción</label>
          <textarea id="description" name="description" rows="3" placeholder="¿Qué se debe realizar?"></textarea>
          <button type="submit">Crear tarea</button>
          <p id="form-message" class="notification" role="status"></p>
        </form>
      </section>

      <div data-component="panel"></div>
    </main>

    <div data-component="footer"></div>
  </div>
</body>
</html>
